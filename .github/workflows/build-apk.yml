name: Build & verify PulseBoost Pro APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Prepare keystore
        working-directory: android-app
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias pulseboost -keyalg RSA -keysize 2048 -validity 10950 -storepass pulseboost -keypass pulseboost -dname "CN=PulseBoost Pro, OU=Mobile, O=PulseBoost, C=US"
          echo "PULSEBOOST_KEYSTORE=$PWD/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android-app
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.7/bin:$PATH
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK=$(ls android-app/app/build/outputs/apk/release/*.apk | head -n1)
          echo "APK: $APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -E "classes.dex|resources.arsc|AndroidManifest"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pulseboost-pro
          path: android-app/app/build/outputs/apk/release/*.apk
